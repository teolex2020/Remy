name: Windows installer

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --yes --no-progress
          }

      - name: Build RemySetup.exe
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Python python -Clean

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Remy-Windows-Installer
          path: |
            release/RemySetup.exe
            release/RemySetup.sha256
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag release/RemySetup.exe release/RemySetup.sha256 --clobber
          } else {
            gh release create $tag release/RemySetup.exe release/RemySetup.sha256 --generate-notes --title "Remy $tag"
          }
