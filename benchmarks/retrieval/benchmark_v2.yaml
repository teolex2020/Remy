# Remy Search Quality Benchmark v2
#
# Snapshot cases are deliberately synthetic but realistic. They exercise the
# production SearchGateway with fixed provider responses, so ranking changes
# are reproducible in CI. `run_quality_benchmark.py --live` reuses the queries
# for a non-gating internet health report.

version: 2
runner_schema: 2

defaults:
  max_results: 10
  thresholds:
    min_recall_at_10: 0.80
    min_ndcg_at_10: 0.75
    min_mrr: 0.50
    min_independent_domains: 2
    require_target_domain: true
    max_duplicate_rate: 0.0

regression_tolerances:
  recall_at_10: 0.03
  ndcg_at_10: 0.03
  mrr: 0.05
  target_domain_hit_rate: 0.03
  independent_domain_rate: 0.05
  duplicate_rate: 0.02

cases:
  - id: q01_python_taskgroup
    category: official_docs
    language: en
    query: "python asyncio TaskGroup exception handling"
    expected_domains: [docs.python.org]
    providers:
      - name: snapshot:duckduckgo
        results:
          - {title: "Coroutines and Tasks — Task Groups", href: "https://docs.python.org/3/library/asyncio-task.html#task-groups", body: "TaskGroup exception handling and cancellation semantics."}
          - {title: "Asyncio TaskGroup discussion", href: "https://discuss.python.org/t/asyncio-taskgroup/", body: "Community discussion of exception handling."}
          - {title: "10 Best Python Asyncio Tricks 2026", href: "https://content-farm.test/top-10-python-asyncio", body: "A list of tricks."}
      - name: snapshot:brave
        results:
          - {title: "Python TaskGroup official documentation", url: "https://docs.python.org/3/library/asyncio-task.html?utm_source=search#task-groups", description: "Official reference for TaskGroup exceptions."}
          - {title: "Structured concurrency with asyncio", url: "https://stackoverflow.com/questions/75250788/python-asyncio-taskgroup", description: "TaskGroup error handling example."}
    judgments:
      "https://docs.python.org/3/library/asyncio-task.html": 3
      "https://discuss.python.org/t/asyncio-taskgroup": 2
      "https://stackoverflow.com/questions/75250788/python-asyncio-taskgroup": 1

