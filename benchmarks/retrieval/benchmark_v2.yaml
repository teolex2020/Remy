    category: official_docs
    language: en
    query: "rust Result error handling question mark operator"
    expected_domains: [doc.rust-lang.org]
    providers:
      - name: snapshot:metasearch
        results:
          - {title: "Recoverable Errors with Result", href: "https://doc.rust-lang.org/book/ch09-02-recoverable-errors-with-result.html", body: "Result and the question mark operator for propagating errors."}
          - {title: "std::result::Result", href: "https://doc.rust-lang.org/std/result/", body: "Result is a type that represents success or failure."}
          - {title: "How do I use the question mark operator?", href: "https://stackoverflow.com/questions/42917566/what-is-this-question-mark-operator-about", body: "Rust error propagation."}
    judgments:
      "https://doc.rust-lang.org/book/ch09-02-recoverable-errors-with-result.html": 3
      "https://doc.rust-lang.org/std/result": 3
      "https://stackoverflow.com/questions/42917566/what-is-this-question-mark-operator-about": 1

