  - id: l05_stale_candidate_stays_pending
    topic: Orion release
    runs:
      - observed_at: "2026-08-01T12:00:00+00:00"
        rows:
          - claim_id: orion-17
            claim: "Orion supported release is version 17."
            status: supported
            relations:
              - {relation: supports, url: "https://archive.test/orion", source_date: "2026-07-30T09:00:00+00:00", evidence_root: "https://archive.test/orion", authority_role: primary, authority_score: 0.85, temporally_valid: true}
