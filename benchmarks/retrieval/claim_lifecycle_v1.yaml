    expected: {tracked_subjects: 1, current_value: "$25", confirmed_transitions: 1, pending_changes: 0, history_events: 2}

  - id: l04_same_origin_change_stays_pending
    topic: service pricing
    runs:
      - observed_at: "2026-08-16T12:00:00+00:00"
        rows:
          - claim_id: price-20
            claim: "The current service price is $20 per month."
            status: supported
            relations:
