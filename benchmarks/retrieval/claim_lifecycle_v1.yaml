version: 1
runner_schema: 1

thresholds:
  min_tracked_subject_accuracy: 1.0
  min_current_value_accuracy: 1.0
  min_transition_accuracy: 1.0
  min_pending_accuracy: 1.0
  min_history_preservation_accuracy: 1.0
  max_unsafe_transition_rate: 0.0

regression_tolerances:
  tracked_subject_accuracy: 0.0
  current_value_accuracy: 0.0
  transition_accuracy: 0.0
  pending_accuracy: 0.0
  history_preservation_accuracy: 0.0
  unsafe_transition_rate: 0.0

cases:
  - id: l01_first_price_observation
    topic: service pricing
    runs:
      - observed_at: "2026-08-22T12:00:00+00:00"
        rows:
          - claim_id: price-20
            claim: "The current service price is $20 per month."
            status: supported
            relations:
              - relation: supports
                url: "https://vendor-one.test/pricing"
                source_date: "2026-08-21T09:00:00+00:00"
                evidence_root: "https://vendor-one.test/pricing"
                authority_role: primary
                authority_score: 0.9
                temporally_valid: true
    expected: {tracked_subjects: 1, current_value: "$20", confirmed_transitions: 0, pending_changes: 0}

  - id: l02_reaffirmed_price_does_not_duplicate_history
    topic: service pricing
    runs:
      - observed_at: "2026-08-22T12:00:00+00:00"
        rows:
          - claim_id: price-20-a
            claim: "The current service price is $20 per month."
            status: supported
            relations:
              - {relation: supports, url: "https://vendor-one.test/pricing", source_date: "2026-08-21T09:00:00+00:00", evidence_root: "https://vendor-one.test/pricing", authority_role: primary, authority_score: 0.9, temporally_valid: true}
      - observed_at: "2026-08-23T12:00:00+00:00"
        rows:
          - claim_id: price-20-b
            claim: "The current service price is $20 per month."
            status: supported
            relations:
              - {relation: supports, url: "https://vendor-one.test/pricing", source_date: "2026-08-22T09:00:00+00:00", evidence_root: "https://vendor-one.test/pricing", authority_role: primary, authority_score: 0.9, temporally_valid: true}
    expected: {tracked_subjects: 1, current_value: "$20", confirmed_transitions: 0, pending_changes: 0, history_events: 1}

  - id: l03_independent_new_price_confirms_transition
    topic: service pricing
    runs:
      - observed_at: "2026-08-16T12:00:00+00:00"
        rows:
          - claim_id: price-20
            claim: "The current service price is $20 per month."
            status: supported
            relations:
              - {relation: supports, url: "https://archive.test/pricing", source_date: "2026-08-15T09:00:00+00:00", evidence_root: "https://archive.test/pricing", authority_role: primary, authority_score: 0.85, temporally_valid: true}
