    expected: {tracked_subjects: 1, current_value: "17|supported", confirmed_transitions: 0, pending_changes: 1, history_events: 1}

  - id: l06_immutable_science_is_not_tracked
    topic: experiment accuracy
    runs:
      - observed_at: "2026-08-22T12:00:00+00:00"
