version: 1
thresholds:
  min_status_accuracy: 1.0
  min_next_action_accuracy: 1.0
  min_repair_accuracy: 1.0
  min_recovery_decision_accuracy: 1.0
  min_recovery_bound_compliance: 1.0
  max_false_completion_rate: 0.0

cases:
  - id: s01_complete_three_lanes
    scenario: complete
    expected_sufficient: true
    expected_next_action: complete
    minimum_repairs: 0
    expected_retry: false

  - id: s02_answer_without_tools
    scenario: no_tools
    expected_sufficient: false
    expected_next_action: execute_missing_lane
    minimum_repairs: 3
    expected_retry: true

  - id: s03_search_without_fetch
    scenario: search_only
    expected_sufficient: false
    expected_next_action: fetch_discovered_source
    minimum_repairs: 3
    expected_retry: true

  - id: s04_same_domain
    scenario: same_domain
    expected_sufficient: false
    expected_next_action: diversify_sources
    minimum_repairs: 1
    expected_retry: true

  - id: s05_unreadable_fetch
    scenario: unreadable
    expected_sufficient: false
    expected_next_action: fetch_discovered_source
    minimum_repairs: 1
    expected_retry: true

  - id: s06_missing_counterevidence_lane
    scenario: missing_last_lane
    expected_sufficient: false
    expected_next_action: execute_missing_lane
    minimum_repairs: 1
    expected_retry: true

  - id: s07_unrelated_search
    scenario: unrelated_search
    expected_sufficient: false
    expected_next_action: execute_missing_lane
    minimum_repairs: 3
    expected_retry: true

  - id: s08_query_variation
    scenario: varied_complete
    expected_sufficient: true
    expected_next_action: complete
    minimum_repairs: 0
    expected_retry: false

  - id: s09_timeout_does_not_retry
    scenario: no_tools
    worker_status: timeout
    expected_sufficient: false
    expected_next_action: execute_missing_lane
    minimum_repairs: 3
    expected_retry: false
